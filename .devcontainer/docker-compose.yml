# DartWing Flutter Development Stack
# Uses the shared flutter-bench image from flutterBench (Opensoft)
name: ${COMPOSE_PROJECT_NAME:-dartwing-flutter}

services:
  flutter:
    image: flutter-bench:${USER:-brett}
    container_name: ${COMPOSE_PROJECT_NAME:-dartwing-flutter}-dev
    env_file: .env

    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      # Workspace (Dartwing flutter project)
      - ..:/workspace:cached

      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock:rw

      # Shell configurations
      - ~/.zshrc:/home/${USER:-brett}/.zshrc:ro
      - ~/.bashrc:/home/${USER:-brett}/.bashrc:ro
      - ~/.oh-my-zsh:/home/${USER:-brett}/.oh-my-zsh:ro
      - ~/.p10k.zsh:/home/${USER:-brett}/.p10k.zsh:ro

      # Git configuration
      - ~/.gitconfig:/home/${USER:-brett}/.gitconfig:ro

      # SSH configurations and keys
      - ~/.ssh/config:/home/${USER:-brett}/.ssh/config:ro
      - ~/.ssh/id_ed25519:/home/${USER:-brett}/.ssh/id_ed25519:ro
      - ~/.ssh/id_ed25519.pub:/home/${USER:-brett}/.ssh/id_ed25519.pub:ro
      - ~/.ssh/id_rsa_ado:/home/${USER:-brett}/.ssh/id_rsa_ado:ro
      - ~/.ssh/id_rsa_ado.pub:/home/${USER:-brett}/.ssh/id_rsa_ado.pub:ro
      - ~/.ssh/known_hosts:/home/${USER:-brett}/.ssh/known_hosts:ro

      # GitHub CLI configuration
      - ~/.config/gh:/home/${USER:-brett}/.config/gh:ro

      # AI Agent Credentials and Configurations
      # Claude (Anthropic)
      - ~/.claude:/home/${USER:-brett}/.claude:cached
      - ~/.claude.json:/home/${USER:-brett}/.claude.json:cached
      - ~/.claude/.credentials.json:/home/${USER:-brett}/.claude/.credentials.json:cached

      # Grok (xAI)
      - ~/.grok:/home/${USER:-brett}/.grok:ro

      # Codex (OpenAI)
      - ~/.codex:/home/${USER:-brett}/.codex:ro

      # GitHub Copilot CLI
      - ~/.copilot-cli:/home/${USER:-brett}/.copilot-cli:ro

    ports:
      - "${FLUTTER_WEB_PORT:-3000}:3000"   # Flutter web dev server
      - "${WEB_PORT:-8080}:8080"           # General web server
      - "${ADB_PORT:-5037}:5037"           # ADB server port
      - "5554:5554"                         # Android emulator console
      - "5555:5555"                         # Android emulator ADB
      - "1455:1455"                         # Codex auth callback

    command: sleep infinity
    working_dir: /workspace

    environment:
      - FLUTTER_ROOT=/opt/flutter
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - ANDROID_HOME=/opt/android-sdk
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DISABLE_AUTO_SSH_AGENT=1

    deploy:
      resources:
        limits:
          memory: ${CONTAINER_MEMORY:-4g}
          cpus: "${CONTAINER_CPUS:-2}"
